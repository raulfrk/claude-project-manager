repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Per-plugin loop is REQUIRED (cannot be a single basedpyright invocation)
      # because each plugin has its own isolated venv at plugins/<x>/server/.venv
      # with plugin-specific deps (mcp, httpx, pyyaml, rank_bm25, etc.). A single
      # invocation from plugins/_shared's venv would emit hundreds of unresolved-
      # import errors. Each iteration runs in its plugin's venv but reads the
      # top-level /pyrightconfig.json (basedpyright walks up parent dirs to find
      # config). That preserves single-source-of-truth for diagnostic rules
      # without requiring a unified meta-venv. See todo 760 + spec
      # docs/superpowers/specs/2026-04-26-basedpyright-unified-config-design.md
      # for the full analysis.
      #
      # --pythonpath ./.venv/bin/python is REQUIRED: basedpyright's auto venv
      # detection picks the closest .venv walking UP from the basedpyright
      # executable's location. Repo root has a .venv (installer pyproject) that
      # gets selected over each plugin's .venv → plugin-specific deps appear
      # unresolved → cascade of "Unknown type" errors (e.g. wiki's rank_bm25).
      # Explicit --pythonpath forces the per-plugin venv used by `uv run`.
      - id: basedpyright
        name: basedpyright
        entry: bash -c 'export UV_CACHE_DIR="${UV_CACHE_DIR:-.uv-cache}"; exit_code=0; for dir in plugins/*/server; do echo "==> basedpyright $dir"; uv run --directory "$dir" python -m basedpyright --pythonpath ./.venv/bin/python server || exit_code=1; done; echo "==> basedpyright plugins/_shared"; uv run --directory plugins/_shared python -m basedpyright --pythonpath ./.venv/bin/python hook_transport hook_dispatch sandbox session_key scrubbing claudemd || exit_code=1; exit $exit_code'
        language: system
        pass_filenames: false
        types: [python]

      - id: update-readme
        name: Auto-update README
        entry: python scripts/update_readme.py
        language: system
        pass_filenames: false
        files: '(marketplace\.json|\.test-summary\.json|README\.md)$'

      - id: shared-version-cascade
        name: _shared version cascade (Rego)
        entry: bash -c 'command -v conftest >/dev/null || { echo "conftest not installed; skipping (CI gates this)"; exit 0; } && python scripts/_gather_shared_version_state.py | conftest test --namespace cpm.shared_version_cascade --policy policies/ -'
        language: system
        pass_filenames: false
        stages: [pre-commit]

