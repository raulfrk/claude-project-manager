name: Caveman guard

# Block caveman-experiment content from landing on main or dev.
# The dev-caveman branch is a permanent experimental sidecar that MUST NOT
# merge back. Any diff adding caveman markers to main/dev fails this check.

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject caveman markers
        run: |
          set -euo pipefail
          markers=(
            "Caveman-Aware Output"
            "CPM-CAVEMAN-BACKUP"
            "Caveman Mode Precedence"
            "_CAVEMAN_APPEND"
            "# cpm:caveman"
          )
          failed=0
          for m in "${markers[@]}"; do
            # Search tracked files; exclude files that document or implement
            # the guard itself (they reference markers by name, not by content):
            #   - the guard workflow + pre-commit hook (literal marker lists)
            #   - project CLAUDE.md (documents the marker contract)
            #   - installer/claudemd.py (defines the MANAGED_SECTION variants
            #     and references _CAVEMAN_APPEND by name in its docstring)
            matches=$(git grep -l -F -- "$m" \
              -- ':!.github/workflows/caveman-guard.yml' \
                 ':!.pre-commit-hooks/caveman-guard.sh' \
                 ':!CLAUDE.md' \
                 ':!installer/claudemd.py' \
              || true)
            if [ -n "$matches" ]; then
              echo "::error::Caveman marker '$m' found in tracked files:"
              echo "$matches"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo "Caveman content must stay on the dev-caveman branch and never merge to main/dev."
            echo "See CLAUDE.md 'Caveman Branch Switching' section for details."
            exit 1
          fi
          echo "Caveman guard clean."
