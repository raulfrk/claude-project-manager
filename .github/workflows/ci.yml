name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync venvs
        run: |
          for dir in plugins/*/server; do
            echo "==> uv sync $dir"
            uv sync --frozen --directory "$dir" --group dev --group test
          done

      - uses: pre-commit/action@v3.0.1

  test:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: proj
            path: plugins/proj/server
          - plugin: worktree
            path: plugins/worktree/server
          - plugin: sandbox
            path: plugins/sandbox/server
          - plugin: hooks
            path: plugins/hooks/server
          - plugin: trello
            path: plugins/trello/server
          - plugin: jira
            path: plugins/jira/server
          - plugin: todoist
            path: plugins/todoist/server
          - plugin: zoxide
            path: plugins/zoxide/server
          - plugin: _shared
            path: plugins/_shared
    name: test (${{ matrix.plugin }})
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --directory ${{ matrix.path }} --group test

      - name: Run tests
        run: uv run --directory ${{ matrix.path }} pytest

  test-installer-e2e:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-e2e-${{ hashFiles('installer/tests/e2e/Dockerfile', 'pyproject.toml', 'uv.lock') }}
          restore-keys: buildx-e2e-

      - name: Build e2e test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: installer/tests/e2e/Dockerfile
          load: true
          tags: cpm-e2e:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Run e2e tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/installer/tests/e2e/snapshots:/app/installer/tests/e2e/snapshots \
            cpm-e2e:latest \
            uv run pytest installer/tests/e2e/ -v

      - name: Move cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: installer/tests/snapshots/
