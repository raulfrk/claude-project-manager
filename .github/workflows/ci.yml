name: CI

# Action version policy (todo-528, 2026-04-11):
# - First-party actions/* stay on floating major tags (v4, v5) — GitHub guarantees
#   Node 24 readiness for its own actions ahead of the Sept 2026 Node 20 cutoff.
# - Third-party actions are SHA-pinned with a trailing version comment for auditability.
# - astral-sh/setup-uv: pinned to v8 (latest stable, Node 24 native JS action).
# - pre-commit/action@v3.0.1: composite action (not JS), so the Node 20→24 deprecation
#   does NOT apply. No FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 fallback required.
# - docker/setup-buildx-action: pinned to v3.12.0 (latest v3.x). Docker actions; not
#   affected by the JS runtime env-var fallback.
# - docker/build-push-action: pinned to v6.19.2. DO NOT bump to v7/v8 — cache schema
#   break between v6 and later majors.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate_snapshots:
        description: "Regenerate all snapshot goldens in Docker"
        type: boolean
        default: false

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Sync venvs
        run: |
          for dir in plugins/*/server; do
            echo "==> uv sync $dir"
            uv sync --frozen --directory "$dir" --group dev --group test
          done

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Install conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v0.49.1/conftest_0.49.1_Linux_x86_64.tar.gz" \
            | sudo tar -xzv -C /usr/local/bin/ conftest

      - name: Run cpm Rego policies
        run: |
          set -euo pipefail
          echo "==> shared_version_cascade"
          python scripts/_gather_shared_version_state.py | conftest test --namespace cpm.shared_version_cascade --policy policies/ -
          echo "==> version_parity"
          conftest test --namespace cpm.version_parity --combine --policy policies/ .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json
          echo "==> port_uniqueness"
          conftest test --namespace cpm.port_uniqueness --policy policies/ plugins/_shared/ports.yaml
          echo "==> condition_paths"
          for f in plugins/*/.claude-plugin/default-hooks.yaml; do
            [ -f "$f" ] && conftest test --namespace cpm.condition_paths --policy policies/ "$f"
          done
          echo "==> Rego unit tests"
          conftest verify --policy policies/

  test:
    needs: pre-commit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: proj
            path: plugins/proj/server
          - plugin: worktree
            path: plugins/worktree/server
          - plugin: router
            path: plugins/router/server
          - plugin: trello
            path: plugins/trello/server
          - plugin: jira
            path: plugins/jira/server
          - plugin: todoist
            path: plugins/todoist/server
          - plugin: confluence
            path: plugins/confluence/server
          - plugin: wiki
            path: plugins/wiki/server
          - plugin: _shared
            path: plugins/_shared
    name: test (${{ matrix.plugin }})
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --directory ${{ matrix.path }} --group test

      - name: Run tests
        run: uv run --directory ${{ matrix.path }} pytest

  test-installer:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run installer unit tests
        run: uv run pytest installer/tests/ --ignore=installer/tests/e2e -v

  test-installer-e2e:
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-e2e-${{ hashFiles('installer/tests/e2e/Dockerfile', 'pyproject.toml', 'uv.lock') }}
          restore-keys: buildx-e2e-

      - name: Build e2e test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: installer/tests/e2e/Dockerfile
          load: true
          tags: cpm-e2e:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Clean any stray plugin venvs from the runner workspace before bind-mounting.
      # The host `plugins/` tree is bind-mounted into the container at /app/plugins,
      # so any `plugins/*/server/.venv/` directories present on the runner would be
      # dragged into the container and could shadow /opt/venv or confuse uv.
      - name: Clean host plugin venvs
        run: find plugins -type d -name .venv -prune -exec rm -rf {} + || true

      # Bind-mount the full workspace at /app (see installer/tests/e2e/Dockerfile).
      # The image no longer `COPY .`s the source tree — /app is empty at build
      # time and the source is bind-mounted at runtime. On CI a whole-workspace
      # mount is safe because the runner has a fresh checkout (no host venv
      # pollution from plugins/*/server/.venv/ that we worry about in the local
      # run.sh flow).
      #
      # `--user $(id -u):$(id -g)` runs the container as the host UID/GID so any
      # files written back to the bind-mounted workspace (snapshots, caches) are
      # owned by the runner user, not root — otherwise the auto-commit step
      # would fail to `git add` root-owned files.
      - name: Run e2e tests (also generates missing goldens)
        run: |
          if [ "${{ github.event.inputs.regenerate_snapshots }}" = "true" ]; then
            MODE="SNAPSHOT_UPDATE=1"
          else
            MODE="SNAPSHOT_CREATE_MISSING=1"
          fi
          # TEXTUAL_ANIMATIONS=none disables Collapsible/Select cursor
          # animations that caused nondeterministic renders between the
          # generate and validate passes.
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e TEXTUAL_ANIMATIONS=none \
            -v ${{ github.workspace }}:/app \
            cpm-e2e:latest \
            sh -c "$MODE pytest installer/tests/e2e/ -v"

      - name: Commit generated snapshots
        run: |
          if [ ! -d installer/tests/e2e/snapshots ]; then
            echo "No snapshots directory — Textual SVG snapshots removed in P4 (#672)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add installer/tests/e2e/snapshots/
          if git diff --cached --quiet; then
            echo "No new snapshots to commit"
          else
            git commit -m "CI: regenerate snapshot goldens from Docker [skip ci]"
            git push
          fi

      - name: Move cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Generate visual diff report
        if: failure()
        run: |
          if [ ! -d installer/tests/e2e/snapshots ]; then
            echo "No snapshots directory — nothing to diff"
            exit 0
          fi
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/app \
            cpm-e2e:latest \
            python installer/tests/e2e/snapshot_diff.py \
              installer/tests/e2e/snapshots \
              installer/tests/e2e/snapshots/diff-report.html

      - name: Upload snapshots and diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-svgs
          path: installer/tests/e2e/snapshots/
          if-no-files-found: ignore
