hooks:
  - id: todoist-on-todo-add
    trigger_tool: todo_add
    target_tool: todoist_add_tasks
    server: todoist
    param_mapping:
      tasks:
        - content: "${title}"
          projectId: "${todoist_project_id}"
          parentId: "${parent_todoist_task_id}"
          priority: "${priority}"
          labels: "${synced_tags}"
          description: "${notes}"
          dueString: "${due_date}"
    feedback_tool: todo_update
    feedback_mapping:
      successes.0.id: todoist_task_id
    blocking: true
    condition: "sync.todoist.enabled and sync.todoist.auto_sync and project.todoist_project_id"

  - id: todoist-on-todo-complete
    trigger_tool: todo_complete
    target_tool: todoist_complete_tasks
    server: todoist
    param_mapping:
      ids: "${todoist_task_ids}"
    blocking: true
    condition: "sync.todoist.enabled and sync.todoist.auto_sync"

  - id: todoist-on-todo-update
    trigger_tool: todo_update
    target_tool: todoist_update_tasks
    server: todoist
    param_mapping:
      tasks:
        - id: "${todoist_task_id}"
          content: "${title}"
          labels: "${tags}"
          description: "${notes}"
          dueString: "${due_date}"
    blocking: true
    condition: "sync.todoist.enabled and todo.todoist_task_id"

  - id: todoist-on-todo-delete
    trigger_tool: todo_delete
    target_tool: todoist_delete
    server: todoist
    param_mapping:
      id: ${todoist_task_id}
    blocking: true
    condition: "sync.todoist.enabled and todo.todoist_task_id"

  - id: todoist-on-proj-init
    trigger_tool: proj_init
    target_tool: todoist_add_projects
    server: todoist
    param_mapping:
      name: ${project_name}
    feedback_tool: proj_update_meta
    feedback_mapping:
      id: todoist_project_id
    blocking: true
    condition: "sync.todoist.enabled"

  - id: todoist-on-proj-load
    trigger_tool: proj_load_session
    target_tool: todoist_find_projects
    server: todoist
    param_mapping:
      name: ${project_name}
    blocking: true
    condition: "sync.todoist.enabled"

  - id: todoist-full-sync-on-proj-load
    trigger_tool: proj_load_session
    target_tool: proj_sync
    server: proj
    param_mapping:
      integration: "todoist"
      project_name: "${project_name}"
    blocking: true
    condition: "sync.todoist.enabled and sync.todoist.auto_sync and project.todoist_project_id"

  - id: todoist-on-proj-archive
    trigger_tool: proj_archive
    target_tool: todoist_find_tasks
    server: todoist
    param_mapping:
      project_id: ${todoist_project_id}
    blocking: true
    condition: "sync.todoist.enabled and project.todoist_project_id"

  - id: verify-todoist-complete
    trigger_tool: todo_complete
    target_tool: todoist_verify_complete
    server: todoist
    param_mapping:
      todoist_task_id: "${todoist_task_id}"
    result_condition:
      is_batch: false
    blocking: true
    verification: true
    condition: "sync.todoist.enabled and sync.todoist.auto_sync"

