hooks:
  # NOTE: The `proj` label (blue) is intentionally NOT applied here.
  # The hook param-mapping DSL only supports `${path}` substitution from
  # `source_result` / `proj.yaml`; it cannot call `get_labels` and filter
  # by name to resolve a label ID at fire time. Accepted fallback:
  # the card is created without its label, then the next `/proj:trello-sync`
  # run detects the missing label via `push_update_labels` and calls
  # `toggle_card_label(..., action="add")` to add it. Brief gap only —
  # do not revisit without extending the hook DSL first.
  - id: trello-on-proj-init
    trigger_tool: proj_init
    target_tool: add_card_to_list
    server: trello
    param_mapping:
      list_id: "${sync.trello.default_list_id}"
      name: "${project_name}"
    blocking: true
    condition: "sync.trello.enabled"
    feedback_tool: proj_update_meta
    feedback_mapping:
      id: trello_card_id

  - id: trello-on-proj-load
    trigger_tool: proj_load_session
    target_tool: get_card
    server: trello
    param_mapping:
      card_id: "${trello_card_id}"
    blocking: true
    condition: "sync.trello.enabled and project.trello_card_id"

  - id: trello-on-proj-archive
    trigger_tool: proj_archive
    target_tool: move_card
    server: trello
    param_mapping:
      card_id: "${trello_card_id}"
      list_id: "${sync.trello.list_mappings.archived}"
    blocking: false  # reason: archive is fire-and-forget state update
    condition: "sync.trello.enabled and project.trello_card_id and sync.trello.list_mappings.archived"

  # NOTE: The `proj-task` label (green) is intentionally NOT applied here.
  # Same limitation as `trello-on-proj-init` above: the hook DSL can't
  # resolve a label ID by name at fire time. Accepted fallback: the next
  # `/proj:trello-sync` run adds the missing label via `push_update_labels`
  # + `toggle_card_label(..., action="add")`. Brief gap only —
  # do not revisit without extending the hook DSL first.
  - id: trello-on-todo-add
    trigger_tool: todo_add
    target_tool: add_card_to_list
    server: trello
    param_mapping:
      list_id: "${trello_list_id}"
      name: "${title}"
      desc: "${notes}"
      due: "${due_date}"
    blocking: true
    condition: "sync.trello.enabled and sync.trello.auto_sync and project.trello_card_id"
    feedback_tool: todo_update
    feedback_mapping:
      id: trello_card_id

  - id: trello-on-todo-complete
    trigger_tool: todo_complete
    target_tool: move_card
    server: trello
    param_mapping:
      card_id: "${trello_card_id}"
      list_id: "${trello_done_list_id}"
    blocking: true
    condition: "sync.trello.enabled and sync.trello.auto_sync and todo.trello_card_id"

  - id: trello-on-todo-uncomplete
    trigger_tool: todo_uncomplete
    target_tool: move_card
    server: trello
    param_mapping:
      card_id: "${trello_card_id}"
      list_id: "${trello_list_id}"
    blocking: true
    condition: "sync.trello.enabled and sync.trello.auto_sync and todo.trello_card_id"

  - id: verify-trello-todo-card
    trigger_tool: todo_complete
    target_tool: get_card
    server: trello
    param_mapping:
      card_id: "${trello_card_id}"
    verification: true
    condition: "sync.trello.enabled"

  - id: trello-on-todo-update
    trigger_tool: todo_update
    target_tool: update_card_details
    server: trello
    param_mapping:
      card_id: "${trello_card_id}"
      name: "${title}"
      desc: "${notes}"
      due: "${due_date}"
    blocking: true
    condition: "sync.trello.enabled and sync.trello.auto_sync and todo.trello_card_id"

  - id: trello-on-todo-delete
    trigger_tool: todo_delete
    target_tool: archive_card
    server: trello
    param_mapping:
      card_id: "${trello_card_id}"
    blocking: true
    condition: "sync.trello.enabled and sync.trello.auto_sync and todo.trello_card_id"

  - id: trello-on-todo-complete-batch
    trigger_tool: todo_complete
    target_tool: trello_batch_archive_cards
    server: trello
    param_mapping:
      card_ids: "${trello_card_ids}"
    blocking: true
    condition: "sync.trello.enabled and sync.trello.auto_sync"
    result_condition:
      is_batch: true
