hooks:
  - id: perms-on-setup-permissions
    trigger_tool: proj_setup_permissions
    target_tool: perms_batch_setup
    server: perms
    param_mapping:
      paths: "${paths}"
      mcp_servers: "${mcp_servers}"
    blocking: true
    condition: "perms_integration"

  - id: perms-on-revoke-permissions
    trigger_tool: proj_revoke_all_permissions
    target_tool: perms_batch_revoke
    server: perms
    param_mapping:
      paths: "${paths}"
      mcp_servers: "${mcp_servers}"
    blocking: true
    condition: "perms_integration"

  - id: perms-on-proj-add-repo
    trigger_tool: proj_add_repo
    target_tool: perms_batch_setup
    server: perms
    param_mapping:
      paths: "${paths}"
    blocking: true
    condition: "perms_integration"

  - id: perms-on-proj-remove-repo
    trigger_tool: proj_remove_repo
    target_tool: perms_batch_revoke
    server: perms
    param_mapping:
      paths: "${paths}"
    blocking: true
    condition: "perms_integration"
