[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "router-mcp-server"
version = "3.0.0"
description = "MCP server for cpm router plugin (MCP-to-MCP dispatch registry)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "claude-hook-transport",
]

[project.scripts]
router-server = "server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv.sources]
claude-hook-transport = { path = "../../_shared" }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "basedpyright>=1.2",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.5",
    "pytest-mock>=3.14",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "bandit>=1.7",
    "pip-audit>=2.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP", "SIM", "RUF", "TCH", "S"]
ignore = ["S603", "S607"]  # subprocess calls are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"tests/*" = ["TC003"]  # runtime Path usage fine in tests

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportUnusedFunction = false  # @mcp.tool() decorated functions flagged as unused
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false  # runtime guards for dynamic JSON/MCP data (34 sites)
reportUnknownParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--cov=server", "--cov-fail-under=80", "-n", "auto"]
markers = ["e2e: end-to-end tests requiring subprocess servers"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "server/main.py"]
