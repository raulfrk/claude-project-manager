[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proj-mcp-server"
version = "4.0.0"
description = "MCP server for project lifecycle management"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "claude-hook-transport",
]

[project.scripts]
proj-server = "server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv.sources]
claude-hook-transport = { path = "../../_shared" }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "basedpyright>=1.2",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.5",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "respx>=0.22",
]
lint = [
    "bandit>=1.7",
    "pip-audit>=2.8",
]
docs = [
    "pdoc>=14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP", "SIM", "RUF", "TCH", "PTH", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"tests/*" = ["TC001", "TC003"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# claudemd_branch_aware.py imports from `installer.claudemd` which is not
# a dependency of this package — it is loaded at runtime by the installer
# wizard which runs inside the installer's own venv. Exclude it from the
# proj-server type-check pass; the installer runs its own basedpyright.
exclude = ["server/scripts/claudemd_branch_aware.py"]
reportUnusedFunction = false  # @mcp.tool() decorated functions flagged as unused
# reportUnknownMemberType: blocked by httpx/mcp stubs (would cascade 100+ errors)
reportUnknownMemberType = false
# reportUnknownVariableType: blocked until JsonValue unified across plugins
reportUnknownVariableType = false
# reportUnknownArgumentType: blocked by httpx/mcp stubs
reportUnknownArgumentType = false
reportPrivateUsage = false
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false  # runtime guards for dynamic JSON/MCP data (34 sites)
# reportUnknownParameterType: blocked by httpx/mcp stubs
reportUnknownParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--cov=server", "--cov-fail-under=72", "-n", "auto"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "server/main.py", "server/cli.py"]
