hooks:
  - id: proj-tracking-flush-on-todo-complete
    trigger_tool: todo_complete
    target_tool: tracking_git_flush
    server: proj
    param_mapping:
      commit_message: "Todo: complete ${todo_id}"
    blocking: true
    condition: "git_tracking.enabled"

  - id: proj-tracking-flush-on-todo-add
    trigger_tool: todo_add
    target_tool: tracking_git_flush
    server: proj
    param_mapping:
      commit_message: "Todo: add ${todo_id}"
    blocking: true
    condition: "git_tracking.enabled"

  - id: proj-tracking-flush-on-todo-update
    trigger_tool: todo_update
    target_tool: tracking_git_flush
    server: proj
    param_mapping:
      commit_message: "Todo: update ${todo_id}"
    blocking: true
    condition: "git_tracking.enabled"

  - id: proj-tracking-flush-on-todo-delete
    trigger_tool: todo_delete
    target_tool: tracking_git_flush
    server: proj
    param_mapping:
      commit_message: "Todo: delete ${todo_id}"
    blocking: true
    condition: "git_tracking.enabled"

  - id: proj-tracking-flush-on-archive
    trigger_tool: proj_archive
    target_tool: tracking_git_flush
    server: proj
    param_mapping:
      commit_message: "Archive: ${project_name}"
    blocking: true
    condition: "git_tracking.enabled"

  - id: proj-tracking-flush-on-init
    trigger_tool: proj_init
    target_tool: tracking_git_flush
    server: proj
    param_mapping:
      commit_message: "Init: ${project_name}"
    blocking: true
    condition: "git_tracking.enabled"

  - id: proj-sandbox-sync-on-load-session
    trigger_tool: proj_load_session
    target_tool: proj_perms_sync
    server: proj
    param_mapping: {}
    blocking: true
    condition: "sandbox_integration"

  # Sandbox hooks migrated from the (now-folded) sandbox plugin into proj.
  # See commit 0608506 (feat(605.8): fold sandbox plugin into proj MCP server)
  # and todo 650. These keep the original hook ids so that router
  # orphan-detection can update stale entries in users' hooks.yaml that
  # still point at the removed ``server: sandbox``.
  - id: sandbox-on-setup-permissions
    trigger_tool: proj_setup_permissions
    target_tool: sandbox_batch_setup
    server: proj
    param_mapping:
      paths: "${paths}"
      mcp_servers: "${mcp_servers}"
    blocking: true
    condition: "sandbox_integration"

  - id: sandbox-on-revoke-permissions
    trigger_tool: proj_revoke_all_permissions
    target_tool: sandbox_batch_revoke
    server: proj
    param_mapping:
      paths: "${paths}"
      mcp_servers: "${mcp_servers}"
    blocking: true
    condition: "sandbox_integration"

  - id: verify-sandbox-setup
    trigger_tool: proj_setup_permissions
    target_tool: sandbox_check
    server: proj
    param_mapping:
      scope: "user"
    verification: true
    condition: "sandbox_integration"

  - id: sandbox-on-proj-add-repo
    trigger_tool: proj_add_repo
    target_tool: sandbox_batch_setup
    server: proj
    param_mapping:
      paths: "${paths}"
    blocking: true
    condition: "sandbox_integration"

  - id: sandbox-on-proj-remove-repo
    trigger_tool: proj_remove_repo
    target_tool: sandbox_batch_revoke
    server: proj
    param_mapping:
      paths: "${paths}"
    blocking: true
    condition: "sandbox_integration"
