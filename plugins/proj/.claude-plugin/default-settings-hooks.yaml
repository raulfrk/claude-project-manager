# cpm:proj-session-start-all
hooks:
  - id: proj-session-start-all
    event: SessionStart
    matchers: [startup, resume, clear, compact]
    command: "{python} {script} --cwd \"$CLAUDE_PROJECT_DIR\""
    script: "{plugin_cache_dir}/server/server/scripts/session_start_loader.py"
    python: python3
    description: "Auto-load tracked claude-project-manager project based on cwd"
  - id: proj-session-start-router-health
    event: SessionStart
    matchers: [startup, resume, clear, compact]
    command: "{python} {script}"
    script: "{plugin_cache_dir}/server/server/scripts/session_start_router_health.py"
    python: python3
    description: "Probe hook router socket; emit banner if unreachable"
