[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hook-transport"
version = "0.3.3"
description = "Shared dual-transport library for MCP plugin inter-server hook communication"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["hook_transport", "hook_dispatch"]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP", "SIM", "RUF", "TCH", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--cov=hook_transport", "--cov=hook_dispatch", "--cov-fail-under=80"]
