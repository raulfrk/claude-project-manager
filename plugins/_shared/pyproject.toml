[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hook-transport"
version = "0.4.36"
description = "Shared dual-transport library for MCP plugin inter-server hook communication"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hook_transport", "hook_dispatch", "scrubbing", "test_contracts", "claudemd", "session_key", "sandbox"]
force-include = { "claudemd/managed_section.md" = "claudemd/managed_section.md" }

[dependency-groups]
dev = [
    "basedpyright>=1.2",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "jsonschema>=4.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP", "SIM", "RUF", "TCH", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

# basedpyright config: see /pyrightconfig.json (top-level, single source of truth)

[tool.pytest.ini_options]
testpaths = ["tests", "test_contracts/tests"]
# NOTE: --cov-fail-under=80 aggregates coverage across ALL --cov targets above.
# Running a single test file (e.g. `uv run pytest tests/test_session_key.py`) will
# fail the gate even when the targeted module is well-covered, because the other
# modules contribute 0% to the aggregate. Workaround: pass --no-cov to skip the
# threshold check for targeted runs:
#   uv run pytest tests/<file> -v --no-cov
addopts = ["-v", "--tb=short", "--cov=hook_transport", "--cov=hook_dispatch", "--cov=scrubbing", "--cov=claudemd", "--cov=test_contracts", "--cov=session_key", "--cov-fail-under=80"]

[tool.coverage.run]
omit = [
    # CLI tool — exercised manually + in the openapi-refresh GH Actions workflow.
    "test_contracts/sync_openapi.py",
]
