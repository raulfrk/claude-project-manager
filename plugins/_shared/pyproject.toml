[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-hook-transport"
version = "0.4.23"
description = "Shared dual-transport library for MCP plugin inter-server hook communication"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hook_transport", "hook_dispatch", "scrubbing", "test_contracts", "claudemd", "session_key"]
force-include = { "claudemd/managed_section.md" = "claudemd/managed_section.md" }

[dependency-groups]
dev = [
    "basedpyright>=1.2",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "jsonschema>=4.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP", "SIM", "RUF", "TCH", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportUnusedFunction = false  # @mcp.tool() decorated functions flagged as unused
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false  # runtime guards for dynamic JSON/MCP data (34 sites)
reportUnknownParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests", "test_contracts/tests"]
addopts = ["-v", "--tb=short", "--cov=hook_transport", "--cov=hook_dispatch", "--cov=scrubbing", "--cov=claudemd", "--cov=test_contracts", "--cov=session_key", "--cov-fail-under=80"]

[tool.coverage.run]
omit = [
    # CLI tool — exercised manually + in the openapi-refresh GH Actions workflow.
    "test_contracts/sync_openapi.py",
]
