hooks:
  - id: jira-on-todo-add
    trigger_tool: todo_add
    target_tool: jira_create_issue
    server: jira
    param_mapping:
      project_key: "${jira_project_key}"
      summary: "${title}"
      description: "${notes}"
      priority: "${priority}"
      labels: "${synced_tags}"
      parent_key:
        value: "${parent_jira_issue_key}"
        omit_if_empty: true
    feedback_tool: todo_update
    feedback_mapping:
      key: jira_issue_key
    blocking: true
    condition: "sync.jira.enabled and sync.jira.auto_sync and project.jira_issue_key"

  - id: jira-on-todo-complete
    trigger_tool: todo_complete
    target_tool: jira_update_issue_fields
    server: jira
    param_mapping:
      key: "${jira_issue_key}"
      resolution: "Done"
    blocking: true
    condition: "sync.jira.enabled and sync.jira.auto_sync and todo.jira_issue_key"

  - id: jira-on-todo-update
    trigger_tool: todo_update
    target_tool: jira_update_issue_fields
    server: jira
    param_mapping:
      key: "${jira_issue_key}"
      summary: "${title}"
      description: "${notes}"
      priority: "${priority}"
      labels: "${synced_tags}"
    blocking: true
    condition: "sync.jira.enabled and sync.jira.auto_sync and todo.jira_issue_key"

  - id: jira-on-todo-batch-complete
    trigger_tool: todo_complete
    target_tool: jira_update_issues_bulk
    server: jira
    param_mapping:
      updates: "${jira_batch_updates}"
    blocking: true
    condition: "sync.jira.enabled and sync.jira.auto_sync"
    result_condition:
      is_batch: true

  - id: jira-on-todo-delete
    trigger_tool: todo_delete
    target_tool: jira_update_issue_fields
    server: jira
    param_mapping:
      key: "${jira_issue_key}"
      resolution: "Won't Do"
    blocking: true
    condition: "sync.jira.enabled and sync.jira.auto_sync and todo.jira_issue_key"

  - id: jira-on-proj-init
    trigger_tool: proj_init
    target_tool: jira_create_issue
    server: jira
    param_mapping:
      project_key: "${jira_project_key}"
      summary: "${project_name}"
      issue_type: "Epic"
    feedback_tool: proj_update_meta
    feedback_mapping:
      key: jira_issue_key
    blocking: true
    condition: "sync.jira.enabled"

  - id: jira-on-proj-load
    trigger_tool: proj_load_session
    target_tool: jira_get_issue
    server: jira
    param_mapping:
      issue_key: "${jira_issue_key}"
    blocking: true
    condition: "sync.jira.enabled and project.jira_issue_key"

  - id: jira-full-sync-on-proj-load
    trigger_tool: proj_load_session
    target_tool: proj_sync
    server: proj
    param_mapping:
      integration: "jira"
    blocking: true
    condition: "sync.jira.enabled and sync.jira.auto_sync and project.jira_issue_key"
