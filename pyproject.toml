[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpm-install"
version = "1.0.0"
description = "Installer for claude-project-manager plugin marketplace"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "httpx>=0.28", "packaging>=24.0", "claude-hook-transport", "prompt_toolkit>=3.0", "rich>=13.0"]

[project.scripts]
cpm-install = "installer.main:main"

[project.optional-dependencies]
plugins = [
    # Plugin server packages (path-deps below). Installing these brings each
    # plugin's *-server script into the shared venv's bin/ so start.sh's
    # `uv run --frozen --no-sync <server>` resolves to the venv-managed
    # script instead of a stale PATH entry.
    "proj-mcp-server",
    "router-mcp-server",
    "todoist-mcp-server",
    "trello-mcp-server",
    "jira-mcp-server",
    "confluence-mcp-server",
    "wiki-server",
    "worktree-mcp-server",
    # Shared transport library (also a transitive dep of every server).
    "claude-hook-transport",
    # Library deps kept explicit so the drift-detection test
    # (installer/tests/test_shared_venv_deps.py) catches new per-plugin deps
    # if a plugin server forgets to declare them.
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "gitpython>=3.1",
    "httpx>=0.28",
    # confluence
    "markdownify>=0.11",
    "beautifulsoup4>=4.12",
    # router
    "packaging>=24.0",
    # wiki
    "rank-bm25>=0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["installer"]
force-include = { "installer/defaults.yaml" = "installer/defaults.yaml", ".claude-plugin/marketplace.json" = "installer/marketplace.json" }

[dependency-groups]
test = ["pytest>=8.0", "pytest-cov>=7.0", "pytest-mock>=3.14", "pytest-asyncio>=0.24", "syrupy>=5.0", "httpx>=0.28", "respx>=0.22", "prompt_toolkit>=3.0", "rich>=13.0"]

[tool.pytest.ini_options]
markers = ["slow: tests that build/install packages (may take >10s)"]

[tool.ruff.lint.per-file-ignores]
"installer/tests/**" = ["S"]
"tests/**" = ["S"]
"scripts/tests/**" = ["S"]

[tool.uv.sources]
claude-hook-transport = { path = "plugins/_shared" }
proj-mcp-server = { path = "plugins/proj/server" }
router-mcp-server = { path = "plugins/router/server" }
todoist-mcp-server = { path = "plugins/todoist/server" }
trello-mcp-server = { path = "plugins/trello/server" }
jira-mcp-server = { path = "plugins/jira/server" }
confluence-mcp-server = { path = "plugins/confluence/server" }
wiki-server = { path = "plugins/wiki/server" }
worktree-mcp-server = { path = "plugins/worktree/server" }
